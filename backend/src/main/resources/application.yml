spring:
  application: { name: tripsync-api }
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripsync}
    username: ${SPRING_DATASOURCE_USERNAME:tripsync}
    password: ${SPRING_DATASOURCE_PASSWORD:tripsync}
  jpa:
    hibernate: { ddl-auto: update }
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
server: { port: 8080 }
app:
  cors-origin: ${APP_CORS_ORIGIN:http://localhost:5173}
  s3:
    bucket: ${S3_BUCKET:tripsync-media}
    region: ${AWS_REGION:ap-south-1}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
management.endpoints.web.exposure.include: health,info
